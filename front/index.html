        // 获取网络名称
        function getNetworkName(chainId) {
            switch (chainId) {
                case '0x1':
                    return 'Mainnet';
                case '0x5':
                    return 'Goerli';
                case '0xaa36a7':
                    return 'Sepolia';
                case '0x7a69':  // 31337 的十六进制表示
                    return 'Hardhat Local Network';
                default:
                    return 'Unknown Network (' + chainId + ')';
            }
        }

        function updateNetworkInfo(chainId) {
            const networkInfoElement = document.getElementById('networkInfo');
            networkInfoElement.textContent = getNetworkName(chainId);
        }

        // 切换网络
        async function switchNetwork(network) {
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: network.chainId }]
                });
            } catch (switchError) {
                // 如果网络不存在，添加该网络
                if (switchError.code === 4902) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [network]
                        });
                    } catch (addError) {
                        console.error('添加网络失败:', addError);
                        alert('添加网络失败: ' + addError.message);
                    }
                } else {
                    console.error('切换网络失败:', switchError);
                    alert('切换网络失败: ' + switchError.message);
                }
            }
        }

                updateNetworkInfo(_chainId);
                // 网络切换后重新加载页面或更新相关信息
